<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D模型 · 展示舱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #container { width: 100%; height: 100%; }
  .hud-title { position: fixed; top: 28px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 10; }
  .hud-title h1 { font-size: clamp(20px, 3.5vw, 42px); font-weight: 800; letter-spacing: 8px;
    background: linear-gradient(90deg, #ff3040, #ff8a3d, #4da3ff, #7b5cff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(255,60,90,.25); animation: titleGlow 4s ease-in-out infinite; }
  .hud-title p { margin-top: 8px; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: 4px; color: rgba(180,200,255,.6); }
  @keyframes titleGlow { 0%,100% { filter: drop-shadow(0 0 8px rgba(80,140,255,.35)); } 50% { filter: drop-shadow(0 0 20px rgba(255,80,120,.5)); } }
  .hud-hint { position: fixed; bottom: 26px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 10; color: rgba(150,170,210,.45); font-size: 12px; letter-spacing: 3px; }
  .hud-hint span { margin: 0 12px; }
  #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a0e1f 0%, #000 70%); transition: opacity .8s ease; color: #8ab4ff; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .loader-ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(90,140,255,.15); border-top-color: #4da3ff; animation: spin 1s linear infinite; }
  #loader p { margin-top: 18px; font-size: 14px; letter-spacing: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="container"></div>
<div class="hud-title"><h1>机甲指挥官</h1><p>MECHA COMMANDER · 太空展示舱</p></div>
<div class="hud-hint"><span>🖱 拖拽旋转</span><span>⚡ 滚轮缩放</span><span>✨ 自动巡航</span></div>
<div id="loader"><div class="loader-ring"></div><p>正在部署模型…</p></div>

<!-- 关键：importmap 必须精确映射（three/addons/ 通配会解析错） -->
<script type="importmap">
{
  "imports": {
    "three": "./js/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./js/loaders/GLTFLoader.js",
    "three/addons/loaders/DRACOLoader.js": "./js/loaders/DRACOLoader.js",
    "three/addons/libs/draco/": "./js/libs/draco/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ============ 场景 ============
const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.0012);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 1.6, 6.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

// ============ 灯光 ============
scene.add(new THREE.AmbientLight(0x8899cc, 0.5));
const keyLight = new THREE.DirectionalLight(0xffe8cc, 2.2); keyLight.position.set(5, 8, 6); keyLight.castShadow = true; scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x4da3ff, 1.6); rimLight.position.set(-6, 3, -5); scene.add(rimLight);
const accentLight = new THREE.PointLight(0xff4050, 1.8, 15); accentLight.position.set(3, -1, 4); scene.add(accentLight);
const blueFill = new THREE.PointLight(0x3060ff, 1.2, 12); blueFill.position.set(-3, 1, 3); scene.add(blueFill);

// ============ 星空粒子 ============
function createStars() {
  const count = 4500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const c1 = new THREE.Color(0x8ab4ff), c2 = new THREE.Color(0xffd9a0), c3 = new THREE.Color(0xffffff);
  for (let i = 0; i < count; i++) {
    const r = 80 + Math.random() * 300, theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
    pos[i*3+2] = r * Math.cos(phi);
    const pick = Math.random(); const col = pick < 0.55 ? c1 : pick < 0.8 ? c2 : c3;
    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.45, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true }));
}
const stars = createStars(); scene.add(stars);

// 程序化星云背景
function createNebula() {
  const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(512, 512, 100, 512, 512, 700);
  grad.addColorStop(0, 'rgba(20,30,80,0.9)'); grad.addColorStop(0.5, 'rgba(10,15,45,0.95)'); grad.addColorStop(1, 'rgba(2,4,12,1)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 14; i++) {
    const x = Math.random()*1024, y = Math.random()*1024, r = 120 + Math.random()*260;
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, r);
    const alpha = 0.04 + Math.random()*0.05, hue = Math.random() < 0.5 ? '120,100,255' : '255,90,160';
    g2.addColorStop(0, `rgba(${hue},${alpha})`); g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  scene.background = new THREE.CanvasTexture(canvas);
}
createNebula();

// ============ 加载模型 ============
let mecha = null;
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('./js/libs/draco/');  // 本地化，别用CDN
loader.setDRACOLoader(draco);

loader.load('./model.glb', (gltf) => {
  mecha = gltf.scene;
  const box = new THREE.Box3().setFromObject(mecha);
  const size = box.getSize(new THREE.Vector3());
  const scale = 3.2 / Math.max(size.x, size.y, size.z);
  mecha.scale.setScalar(scale);
  const center = box.getCenter(new THREE.Vector3());
  mecha.position.set(-center.x * scale, -center.y * scale + 0.2, -center.z * scale);
  scene.add(mecha);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.background = new THREE.Color(0x223355);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture; pmrem.dispose();
  mecha.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
  document.getElementById('loader').classList.add('hide');
}, (xhr) => {
  if (xhr.total) document.querySelector('#loader p').textContent = `正在部署模型… ${Math.round((xhr.loaded/xhr.total)*100)}%`;
}, (err) => { console.error('GLB加载失败:', err); document.querySelector('#loader p').textContent = '模型加载失败，请刷新重试'; });

// ============ 交互（拖拽旋转+滚轮缩放+自动巡航+触屏） ============
const controls = { autoRotate: true, autoSpeed: 0.0025, yaw: 0, pitch: 0, targetYaw: 0, targetPitch: 0, distance: 6.2, targetDistance: 6.2, dragging: false, lastX: 0, lastY: 0, minDist: 3, maxDist: 12 };
let isPointerDown = false;
renderer.domElement.addEventListener('pointerdown', (e) => { isPointerDown = true; controls.dragging = true; controls.lastX = e.clientX; controls.lastY = e.clientY; renderer.domElement.style.cursor = 'grabbing'; });
window.addEventListener('pointermove', (e) => { if (!isPointerDown) return; const dx = e.clientX - controls.lastX, dy = e.clientY - controls.lastY; controls.targetYaw += dx * 0.008; controls.targetPitch += dy * 0.005; controls.targetPitch = Math.max(-1.2, Math.min(1.2, controls.targetPitch)); controls.lastX = e.clientX; controls.lastY = e.clientY; });
window.addEventListener('pointerup', () => { isPointerDown = false; controls.dragging = false; renderer.domElement.style.cursor = 'grab'; });
renderer.domElement.style.cursor = 'grab';
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); controls.targetDistance += e.deltaY * 0.004; controls.targetDistance = Math.max(controls.minDist, Math.min(controls.maxDist, controls.targetDistance)); }, { passive: false });
let touchDist = 0;
renderer.domElement.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { isPointerDown = true; controls.dragging = true; controls.lastX = e.touches[0].clientX; controls.lastY = e.touches[0].clientY; } else if (e.touches.length === 2) { touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } });
renderer.domElement.addEventListener('touchmove', (e) => { e.preventDefault(); if (e.touches.length === 1 && isPointerDown) { const dx = e.touches[0].clientX - controls.lastX, dy = e.touches[0].clientY - controls.lastY; controls.targetYaw += dx * 0.008; controls.targetPitch += dy * 0.005; controls.targetPitch = Math.max(-1.2, Math.min(1.2, controls.targetPitch)); controls.lastX = e.touches[0].clientX; controls.lastY = e.touches[0].clientY; } else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); controls.targetDistance *= touchDist / d; controls.targetDistance = Math.max(controls.minDist, Math.min(controls.maxDist, controls.targetDistance)); touchDist = d; } }, { passive: false });
window.addEventListener('touchend', () => { isPointerDown = false; controls.dragging = false; });

// ============ 动画循环 ============
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!controls.dragging) controls.targetYaw += controls.autoSpeed * dt * 60;
  controls.yaw += (controls.targetYaw - controls.yaw) * 0.08;
  controls.pitch += (controls.targetPitch - controls.pitch) * 0.08;
  controls.distance += (controls.targetDistance - controls.distance) * 0.08;
  const cp = controls.pitch, cy = controls.yaw;
  camera.position.x = Math.sin(cy) * Math.cos(cp) * controls.distance;
  camera.position.y = Math.sin(cp) * controls.distance + 0.4;
  camera.position.z = Math.cos(cy) * Math.cos(cp) * controls.distance;
  camera.lookAt(0, 0.4, 0);
  if (mecha) { mecha.position.y = 0.2 + Math.sin(clock.elapsedTime * 1.2) * 0.12; mecha.rotation.y = Math.sin(clock.elapsedTime * 0.4) * 0.06; }
  stars.rotation.y += 0.0001;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
