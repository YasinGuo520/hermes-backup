model:
  base_url: ''
  default: gpt-5.5
  provider: openai-api
fallback_providers:
  - provider: custom
    model: deepseek-ai/DeepSeek-V4-Flash
    base_url: https://api.siliconflow.cn/v1
    key_env: SILICONFLOW_API_KEY
agent:
  max_turns: 90
  context_length: 32000
terminal:
  backend: local
  cwd: .
  timeout: 180
web:
  backend: ddgs
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
auxiliary:
  vision:
    provider: openai
    model: Qwen/Qwen3-VL-8B-Instruct
    base_url: https://api.siliconflow.cn/v1
    api_key: sk-gawwdwddywiqbybdqkbzjdtwrkymdfkihyjhohzkenbawptj
  compression:
    provider: deepseek
    model: deepseek-v4-flash
  session_search:
    model: deepseek-v4-flash
    provider: deepseek
display:
  language: zh
  platforms:
    lightclawbot:
      streaming: true
dashboard:
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$CrDOncKnZTLF/vYoDu7/+A==$q2RHI2eGO0OY7Tq4Ma0VT/F+26RsZ/llqBvI4GnsrA4=
memory:
  memory_char_limit: 5000
  user_char_limit: 3000
  provider: holographic
delegation:
